.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
label{font-size:12px;color:var(--mu);display:block}

 const wanted=new Set(invoices.map(i=>i.id)),changed=invoices.filter(i=>known[i.id]!==JSON.stringify(i));
 if(changed.length){const {error}=await supabase.from('invoices').upsert(changed.map(invoice=>({id:invoice.id,client_email:invoice.clientEmail||null,invoice})),{onConflict:'id'});if(error)throw error}
 const removed=Object.keys(known).filter(id=>!wanted.has(id));
 if(removed.length){const {error}=await supabase.from('invoices').delete().in('id',removed);if(error)throw error}
 known=Object.fromEntries(invoices.map(i=>[i.id,JSON.stringify(i)]));
};
window.shareInvoice=async id=>{
 const invoice=D.find(item=>item.id===id),email=(invoice?.clientEmail||'').trim().toLowerCase();
 if(!invoice)return;
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){openEd(id);document.getElementById('clientEmail').focus();return}
 invoice.clientEmail=email;
 try{
  await window.sbSave(D);
  const link=new URL('client.html',location.href);link.searchParams.set('invoice',invoice.id);
  const subject=`Accès à la facture ${invoice.no||invoice.date}`;
  const body=`Bonjour ${invoice.client||''},\n\nVotre facture est disponible dans votre espace sécurisé :\n${link.href}\n\nConnectez-vous avec l'adresse ${email}.`;
  say('La facture est autorisée pour '+email+'. Votre messagerie va s’ouvrir.');
    location.href=`mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
 }catch(error){say('Impossible de partager cette facture : '+(error.message||'vérifiez les règles SQL Supabase.'))}
};
window.openInvoiceFile=async encodedPath=>{
 const tab=window.open('about:blank','_blank');
 const {data,error}=await supabase.storage.from('invoice-files').createSignedUrl(decodeURIComponent(encodedPath),3600);
 if(error){tab?.close();alert('Impossible d’ouvrir le document. Vérifiez les règles Storage.');return}
 if(tab)tab.location=data.signedUrl;else location.href=data.signedUrl;
};
window.importInvoiceFiles=async files=>{
 if(!files?.length)return;const button=document.getElementById('invoiceImport');button.disabled=true;
 try{
  for(const file of files){
   if(file.size>50*1024*1024)throw new Error(`${file.name} dépasse la limite de 50 Mo.`);
   let imported=await parseImport(file);
   if(!imported.length)imported=[invoiceFrom(null,file.name)];
   D.unshift(...imported);cur=imported[0].id;await window.sbSave(D);
   const invoice=imported[0],safeName=file.name.replace(/[^a-zA-Z0-9._-]+/g,'_'),path=`${invoice.id}/${Date.now()}_${safeName}`;
   const {error:uploadError}=await supabase.storage.from('invoice-files').upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false});
   if(uploadError)throw uploadError;
   invoice.files=invoice.files||[];invoice.files.push({path,name:file.name});await window.sbSave(D);
  }
  render();say('Import terminé. Vérifiez les informations extraites avant d’envoyer la facture au client.');
 }catch(error){say(`Import interrompu : ${error.message||'erreur Supabase'}`);render()}
 finally{button.disabled=false}
};
async function handleAuth(user){
 if(feed){supabase.removeChannel(feed);feed=null}known={};document.body.classList.toggle('in',!!user);if(!user)return;
 if(!ADMINS.includes((user.email||'').toLowerCase())){location.replace('client.html');return}
 $('who').textContent=user.email;
 try{await loadInvoices();feed=supabase.channel('admin-invoices').on('postgres_changes',{event:'*',schema:'public',table:'invoices'},()=>loadInvoices().catch(()=>say('Impossible de recharger les factures.'))).subscribe()}
 catch(error){$('amsg').textContent='Lecture impossible : vérifiez la configuration et les règles SQL Supabase.'}
}
$('gbtn').onclick=()=>supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}}).then(({error})=>{if(error)$('amsg').textContent='Connexion impossible : '+error.message});
$('out').onclick=()=>supabase.auth.signOut();
supabase.auth.onAuthStateChange((_event,session)=>setTimeout(()=>handleAuth(session?.user),0));
</script></body></html>
